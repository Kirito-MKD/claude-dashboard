// ============ правки: список ============
let editingNote = false;

function doneByBadge(n) {
  if (n.done_by === 'claude') return el('span', { class: 'by claude', title: 'Отмечено агентом через API' }, '✓ закрыл Claude');
  if (n.done_by === 'user') return el('span', { class: 'by user', title: 'Отмечено вами в дашборде' }, '✓ закрыли вы');
  return el('span', { class: 'by unknown' }, '✓ сделано');
}

function noteItem(n) {
  const done = n.status === 'done';
  const textNode = el('div', { class: 'note-text' + (n.text ? '' : ' placeholder') }, n.text || 'без текста');
  const startEdit = () => {
    if (textNode.isContentEditable) return;
    editingNote = true;
    let cancelled = false;
    const original = n.text;
    textNode.textContent = original;
    textNode.classList.remove('placeholder');
    try { textNode.contentEditable = 'plaintext-only'; } catch { textNode.contentEditable = 'true'; }
    if (!textNode.isContentEditable) textNode.contentEditable = 'true';
    textNode.focus();
    getSelection().selectAllChildren(textNode);
    getSelection().collapseToEnd();
    const finish = async (save) => {
      textNode.removeEventListener('keydown', onKey);
      textNode.contentEditable = 'false';
      const value = textNode.innerText.trim();
      if (save && value !== original) {
        try {
          Object.assign(n, await api('/api/notes/' + n.id, jsonBody('PATCH', { text: value })));
          toast('Текст правки сохранён');
        } catch (e) { toast(e.message, true); }
      }
      editingNote = false;
      renderNotes();
    };
    const onKey = (e) => {
      if (e.key === 'Escape') { e.preventDefault(); cancelled = true; textNode.blur(); }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); textNode.blur(); }
    };
    textNode.addEventListener('keydown', onKey);
    textNode.addEventListener('blur', () => finish(!cancelled), { once: true });
  };
  textNode.addEventListener('dblclick', startEdit);

  return el('div', { class: 'note' + (done ? ' done' : ''), dataset: { id: n.id } },
    el('input', {
      type: 'checkbox', checked: done, title: done ? 'Вернуть в работу' : 'Отметить «сделано»',
      'aria-label': 'Сделано', onchange: (e) => setNoteStatus(n, e.target.checked ? 'done' : 'open'),
    }),
    el('div', {},
      textNode,
      n.audio_path && el('audio', { controls: true, preload: 'metadata', src: n.audio_path }),
      n.images.length > 0 && el('div', { class: 'thumbs' }, n.images.map((src) => el('img', { src, alt: 'скриншот', loading: 'lazy', onclick: () => openLightbox(src) }))),
      el('div', { class: 'note-meta' },
        !state.project && el('span', { class: 'chip link', onclick: () => selectProject(n.project) }, n.project),
        el('span', {}, '#' + n.id),
        done && doneByBadge(n),
        timeEl(done && n.done_at ? n.done_at : n.created_at, 'rel'),
        el('button', { class: 'icon-btn push', type: 'button', title: 'Редактировать текст (или двойной клик)', onclick: startEdit }, icon('edit')),
        el('button', { class: 'icon-btn danger', type: 'button', title: 'Удалить правку', onclick: () => deleteNote(n) }, icon('close')),
      ),
    ),
  );
}

function renderNotes() {
  // не перерисовываем список, пока пользователь редактирует текст правки
  if (editingNote) return;
  const open = state.notes.filter((n) => n.status === 'open');
  const done = state.notes.filter((n) => n.status === 'done');
  $('#notes-open').replaceChildren(...(open.length ? open.map(noteItem) : [el('div', { class: 'notes-empty' }, 'Открытых правок нет.')]));
  const count = $('#notes-count');
  count.hidden = !open.length;
  count.textContent = open.length;
  $('#notes-done-wrap').hidden = !done.length;
  const byClaude = done.filter((n) => n.done_by === 'claude').length;
  $('#notes-done-title').textContent = `Сделано (${done.length})` + (byClaude ? ` · Claude закрыл ${byClaude}` : '');
  $('#notes-done').replaceChildren(...done.map(noteItem));
}

async function setNoteStatus(n, status) {
  try {
    Object.assign(n, await api('/api/notes/' + n.id, jsonBody('PATCH', status === 'done' ? { status, done_by: 'user' } : { status })));
    renderNotes();
    loadProjects();
  } catch (e) { toast(e.message, true); renderNotes(); }
}

async function deleteNote(n) {
  if (!confirm('Удалить правку вместе с аудио и картинками?')) return;
  try {
    await api('/api/notes/' + n.id, { method: 'DELETE' });
    state.notes = state.notes.filter((x) => x.id !== n.id);
    renderNotes();
    loadProjects();
  } catch (e) { toast(e.message, true); }
}

function openLightbox(src) {
  $('#lightbox img').src = src;
  $('#lightbox').classList.add('show');
}
$('#lightbox').addEventListener('click', () => $('#lightbox').classList.remove('show'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#lightbox').classList.remove('show'); });

// ============ правки: новая ============
const pending = { audio: null, audioUrl: null, images: [] };

function renderAttachments() {
  const nodes = [];
  if (pending.audio) {
    nodes.push(el('div', { class: 'audio-att' },
      el('audio', { controls: true, src: pending.audioUrl }),
      el('button', { class: 'x', type: 'button', title: 'Убрать запись', onclick: () => setAudio(null) }, '×'),
    ));
  }
  pending.images.forEach((img, i) => {
    nodes.push(el('div', { class: 'thumb' },
      el('img', { src: img.url, alt: img.file.name, onclick: () => openLightbox(img.url) }),
      el('button', { class: 'x', type: 'button', title: 'Убрать', onclick: () => { URL.revokeObjectURL(img.url); pending.images.splice(i, 1); renderAttachments(); } }, '×'),
    ));
  });
  $('#attachments').replaceChildren(...nodes);
}

function setAudio(blob) {
  if (pending.audioUrl) URL.revokeObjectURL(pending.audioUrl);
  pending.audio = blob;
  pending.audioUrl = blob ? URL.createObjectURL(blob) : null;
  renderAttachments();
}

function addFiles(files) {
  let skipped = 0;
  for (const f of files) {
    if (f.type.startsWith('image/')) pending.images.push({ file: f, url: URL.createObjectURL(f) });
    else if (f.type.startsWith('audio/')) setAudio(f);
    else skipped++;
  }
  if (skipped) toast('Можно прикреплять только картинки и аудио', true);
  renderAttachments();
}

// Ctrl+V со скриншотом — в любом месте страницы
document.addEventListener('paste', (e) => {
  const files = [...(e.clipboardData?.items || [])]
    .filter((i) => i.kind === 'file' && i.type.startsWith('image/'))
    .map((i) => i.getAsFile()).filter(Boolean);
  if (!files.length) return;
  e.preventDefault();
  addFiles(files);
  toast(files.length > 1 ? `Добавлено скриншотов: ${files.length}` : 'Скриншот добавлен к правке');
});

// drag & drop на всё окно
let dragDepth = 0;
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes('Files');
window.addEventListener('dragenter', (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $('#drop').classList.add('show'); });
window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('dragleave', (e) => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('show'); } });
window.addEventListener('drop', (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  $('#drop').classList.remove('show');
  addFiles([...e.dataTransfer.files]);
});
$('#file-input').addEventListener('change', (e) => { addFiles([...e.target.files]); e.target.value = ''; });

$('#note-text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('#composer').requestSubmit(); }
});

$('#composer').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (voice.recorder) {
    await stopRecording();
    // финальный кусок расшифровки приходит чуть позже остановки
    await new Promise((r) => setTimeout(r, 400));
  }
  const project = $('#note-project').value.trim();
  const text = $('#note-text').value.trim();
  if (!project) { $('#note-project').focus(); return toast('Укажите проект', true); }
  if (!text && !pending.audio && !pending.images.length) { $('#note-text').focus(); return toast('Правка пустая', true); }
  const fd = new FormData();
  fd.append('project', project);
  fd.append('text', text);
  if (pending.audio) {
    const ext = (pending.audio.type.match(/audio\/(\w+)/) || [, 'webm'])[1].replace('mpeg', 'mp3').replace('mp4', 'm4a');
    fd.append('audio', pending.audio, pending.audio.name || `voice.${ext}`);
  }
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  pending.images.forEach((img, i) => fd.append('images', img.file, img.file.name && img.file.name !== 'image.png' ? img.file.name : `screenshot-${stamp}-${i + 1}.png`));
  const btn = $('#submit-btn');
  btn.disabled = true;
  try {
    await api('/api/notes', { method: 'POST', body: fd });
    storage.set('lastNoteProject', project);
    $('#note-text').value = '';
    $('#interim').textContent = '';
    setAudio(null);
    pending.images.forEach((img) => URL.revokeObjectURL(img.url));
    pending.images = [];
    renderAttachments();
    setHint('');
    toast(state.project && project !== state.project ? `Правка добавлена в проект «${project}»` : 'Правка добавлена');
    loadNotes();
    loadProjects();
  } catch (err) {
    toast('Не удалось сохранить: ' + err.message, true);
  } finally {
    btn.disabled = false;
  }
});

// ============ голос: MediaRecorder + Web Speech API ============
// Один захват микрофона: тот же аудиотрек идёт и в запись, и в распознавание (Chrome 135+).
// Раньше распознавание открывало микрофон второй раз, и на части систем запись обрывалась
// через несколько секунд. Ошибки распознавания никогда не останавливают запись звука.
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const voice = {
  recorder: null, stream: null, track: null, chunks: [], startedAt: 0, timer: null, userStopped: false, stopResolve: null,
  recognizing: false, recognition: null, srTrack: null, srBroken: false, srStartedAt: 0, quickEnds: 0,
  mode: 'cloud', shareTrack: true, localDownloadable: false,
  audioCtx: null, levelRaf: 0,
};

const DEFAULT_HINT = '<kbd>Ctrl</kbd>+<kbd>V</kbd> — вставить скриншот · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> — добавить';
function setHint(text, warn, extra) {
  const h = $('#composer-hint');
  if (!text) {
    h.className = 'hint';
    h.innerHTML = DEFAULT_HINT;
    return;
  }
  h.className = 'hint' + (warn ? ' warn' : '');
  h.replaceChildren(el('span', {}, text));
  if (extra) h.append(el('div', {}, extra));
}
setHint('');

function appendTranscript(chunk) {
  const ta = $('#note-text');
  const clean = chunk.trim();
  if (!clean) return;
  const cur = ta.value;
  const needsSpace = cur && !/\s$/.test(cur);
  const capital = !cur.trim() || /[.!?]\s*$/.test(cur) ? clean[0].toUpperCase() + clean.slice(1) : clean;
  ta.value = cur + (needsSpace ? ' ' : '') + capital;
  ta.scrollTop = ta.scrollHeight;
}

function withTimeout(promise, ms, fallback) {
  return Promise.race([promise, new Promise((r) => setTimeout(() => r(fallback), ms))]);
}

// Офлайн-распознавание (Chrome 139+): работает без интернета и без серверов Google
async function detectRecognitionMode() {
  voice.localDownloadable = false;
  if (!SpeechRec || typeof SpeechRec.available !== 'function') return 'cloud';
  try {
    const st = await withTimeout(SpeechRec.available({ langs: ['ru-RU'], processLocally: true }), 1500, 'unknown');
    if (st === 'available') return 'local';
    voice.localDownloadable = st === 'downloadable' || st === 'downloading';
  } catch { /* другая версия API */ }
  return 'cloud';
}

function installOfflineButton() {
  const btn = el('button', { class: 'btn', type: 'button' }, 'Скачать офлайн-распознавание русского');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'Скачиваю модель…';
    try {
      const ok = await SpeechRec.install({ langs: ['ru-RU'], processLocally: true });
      if (ok === false) throw new Error('браузер отказал в установке');
      voice.localDownloadable = false;
      setHint('Офлайн-распознавание установлено — следующая запись расшифруется без интернета.');
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Скачать офлайн-распознавание русского';
      toast('Не удалось скачать модель: ' + e.message, true);
    }
  });
  return btn;
}

function handleRecognitionError(code, message) {
  if (code === 'no-speech' || code === 'aborted') return; // тишина или наш stop — onend перезапустит
  if (code === 'language-not-supported' && voice.mode === 'local') { voice.mode = 'cloud'; return; }
  voice.srBroken = true;
  const texts = {
    network: 'Нет связи с сервисом распознавания речи. В Яндекс Браузере, Opera и Brave он обычно недоступен — откройте дашборд в Chrome или Edge.',
    'not-allowed': 'Браузер запретил распознавание речи для этой страницы.',
    'service-not-allowed': 'Распознавание речи отключено в этом браузере.',
    'audio-capture': 'Распознаванию не удалось получить звук микрофона.',
    'language-not-supported': 'Русский язык не поддерживается распознаванием в этом браузере.',
  };
  const text = (texts[code] || `Ошибка распознавания: ${code}${message ? ` (${message})` : ''}.`)
    + ' Запись звука продолжается, текст можно ввести вручную.';
  const canInstall = voice.localDownloadable && typeof SpeechRec.install === 'function' && code !== 'not-allowed';
  setHint(text, true, canInstall ? installOfflineButton() : null);
}

function startRecognitionSession() {
  const r = new SpeechRec();
  r.lang = 'ru-RU';
  r.continuous = true;
  r.interimResults = true;
  if (voice.mode === 'local') { try { r.processLocally = true; } catch { /* нет поддержки */ } }
  r.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) appendTranscript(res[0].transcript);
      else interim += res[0].transcript;
    }
    $('#interim').textContent = interim;
  };
  r.onerror = (e) => handleRecognitionError(e.error, e.message);
  r.onend = () => {
    $('#interim').textContent = '';
    if (voice.srTrack) { voice.srTrack.stop(); voice.srTrack = null; }
    if (voice.recognition === r) voice.recognition = null;
    if (!voice.recognizing || voice.srBroken) return;
    // Chrome сам завершает распознавание после паузы — перезапускаем, но не в бесконечном цикле
    voice.quickEnds = Date.now() - voice.srStartedAt < 1000 ? voice.quickEnds + 1 : 0;
    if (voice.quickEnds >= 5) {
      voice.srBroken = true;
      setHint('Распознавание речи постоянно обрывается. Запись звука продолжается, текст можно ввести вручную.', true);
      return;
    }
    setTimeout(() => { if (voice.recognizing && !voice.srBroken) startRecognitionSession(); }, voice.quickEnds ? 300 : 0);
  };
  voice.recognition = r;
  voice.srStartedAt = Date.now();
  if (voice.shareTrack && voice.track && voice.track.readyState === 'live') {
    const t = voice.track.clone();
    try {
      r.start(t);
      voice.srTrack = t;
      return;
    } catch (e) {
      t.stop();
      // TypeError — браузер не умеет распознавать из трека, работаем по-старому
      if (!(e instanceof TypeError)) return handleRecognitionError(e.name || 'start-failed', e.message);
      voice.shareTrack = false;
    }
  }
  try { r.start(); } catch (e) { handleRecognitionError(e.name || 'start-failed', e.message); }
}

function startLevelMeter(stream) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    voice.audioCtx = new Ctx();
    const analyser = voice.audioCtx.createAnalyser();
    analyser.fftSize = 256;
    voice.audioCtx.createMediaStreamSource(stream).connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    const bars = [...document.querySelectorAll('#rec-level i')];
    $('#rec-level').hidden = false;
    const tick = () => {
      analyser.getByteTimeDomainData(data);
      let peak = 0;
      for (const v of data) peak = Math.max(peak, Math.abs(v - 128));
      const level = Math.min(1, peak / 64);
      bars.forEach((b, i) => { b.style.height = `${3 + Math.max(0, level * 13 - Math.abs(i - 2) * 3)}px`; });
      voice.levelRaf = requestAnimationFrame(tick);
    };
    tick();
  } catch { /* индикатор необязателен */ }
}
function stopLevelMeter() {
  cancelAnimationFrame(voice.levelRaf);
  $('#rec-level').hidden = true;
  if (voice.audioCtx) { voice.audioCtx.close().catch(() => {}); voice.audioCtx = null; }
}

function pickMime() {
  for (const m of ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus']) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}

function micErrorText(e) {
  const map = {
    NotAllowedError: 'доступ к микрофону запрещён — разрешите его в настройках сайта (значок слева от адреса)',
    NotFoundError: 'микрофон не найден',
    NotReadableError: 'микрофон занят другим приложением или не отвечает',
    OverconstrainedError: 'микрофон не поддерживает нужные параметры',
    SecurityError: 'страница открыта не по localhost/https — браузер не даёт доступ к микрофону',
  };
  return 'Нет доступа к микрофону: ' + (map[e.name] || e.message || e.name);
}

function resetRecordingUi() {
  clearInterval(voice.timer);
  stopLevelMeter();
  $('#rec-btn').classList.remove('recording');
  $('#rec-label').textContent = 'Голос';
  $('#rec-timer').hidden = true;
}

function stopRecognition() {
  voice.recognizing = false;
  try { voice.recognition && voice.recognition.stop(); } catch { /* уже остановлено */ }
}

function finishRecording(rec) {
  if (voice.recorder !== rec) return;
  voice.recorder = null;
  voice.stream.getTracks().forEach((t) => t.stop());
  if (voice.chunks.length) setAudio(new Blob(voice.chunks, { type: (rec.mimeType || 'audio/webm').split(';')[0] }));
  if (!voice.userStopped) { stopRecognition(); resetRecordingUi(); }
  if (voice.stopResolve) { voice.stopResolve(); voice.stopResolve = null; }
}

async function startRecording() {
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
    return toast(window.isSecureContext ? 'Браузер не поддерживает запись звука' : 'Запись звука работает только на http://localhost:4000 (или https)', true);
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    return toast(micErrorText(e), true);
  }
  const mime = pickMime();
  let rec;
  try {
    rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  } catch (e) {
    stream.getTracks().forEach((t) => t.stop());
    return toast('Не удалось начать запись: ' + e.message, true);
  }
  Object.assign(voice, { stream, track: stream.getAudioTracks()[0], recorder: rec, chunks: [], userStopped: false, srBroken: false, quickEnds: 0 });
  rec.ondataavailable = (e) => { if (e.data && e.data.size) voice.chunks.push(e.data); };
  rec.onerror = (e) => toast('Ошибка записи: ' + ((e.error && (e.error.message || e.error.name)) || 'неизвестная'), true);
  rec.onstop = () => finishRecording(rec);
  voice.track.addEventListener('ended', () => {
    if (voice.recorder === rec && rec.state !== 'inactive') {
      toast('Микрофон отключился — запись остановлена, звук до этого момента сохранён', true);
      stopRecording();
    }
  });
  rec.start(1000);
  voice.startedAt = Date.now();
  $('#rec-btn').classList.add('recording');
  $('#rec-label').textContent = 'Стоп';
  $('#rec-timer').hidden = false;
  const tick = () => {
    const s = Math.floor((Date.now() - voice.startedAt) / 1000);
    $('#rec-timer').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };
  tick();
  voice.timer = setInterval(tick, 500);
  startLevelMeter(stream);

  if (!SpeechRec) {
    setHint('Идёт запись. Расшифровка голоса работает в Chrome и Edge — здесь сохранится только аудио.', true);
    return;
  }
  voice.mode = await detectRecognitionMode();
  if (voice.recorder !== rec) return; // запись уже остановили
  setHint(`Идёт запись… говорите. Текст появится в поле, его можно поправить${voice.mode === 'local' ? ' (распознавание офлайн)' : ''}.`);
  voice.recognizing = true;
  startRecognitionSession();
}

function stopRecording() {
  voice.userStopped = true;
  stopRecognition();
  resetRecordingUi();
  if (!voice.srBroken) setHint('');
  return new Promise((resolve) => {
    const rec = voice.recorder;
    if (!rec || rec.state === 'inactive') { if (rec) finishRecording(rec); return resolve(); }
    voice.stopResolve = resolve;
    rec.stop();
  });
}

$('#rec-btn').addEventListener('click', () => {
  if (voice.recorder) stopRecording();
  else startRecording();
});

// ============ живые обновления ============
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const refreshTasks = debounce(() => loadTasks(), 150);
const refreshNotes = debounce(() => loadNotes(), 150);
const refreshProjects = debounce(() => loadProjects(), 150);
const refreshDetail = debounce(() => loadDetail(), 150);

function connectEvents() {
  const live = $('#live');
  const es = new EventSource('/api/events');
  let first = true;
  es.onopen = () => {
    live.classList.add('on');
    live.querySelector('span').textContent = 'онлайн';
    checkServer();
    // после переподключения могли пропустить события
    if (!first) { refreshProjects(); refreshTasks(); refreshNotes(); refreshDetail(); }
    first = false;
  };
  es.onerror = () => {
    live.classList.remove('on');
    live.querySelector('span').textContent = 'нет связи — переподключаюсь…';
  };
  es.addEventListener('change', (e) => {
    const { kind, project } = JSON.parse(e.data);
    refreshProjects();
    const mine = !state.project || !project || project === state.project;
    if (kind === 'task' && mine) { refreshTasks(); refreshDetail(); }
    if (kind === 'note' && mine) refreshNotes();
    if (kind === 'project') {
      if (!state.project) { refreshTasks(); refreshNotes(); } else if (mine) refreshDetail();
    }
  });
}

// ============ старт ============
setInterval(refreshRelativeTimes, 30000);
let lastServerCheck = 0;
window.addEventListener('focus', () => {
  if (Date.now() - lastServerCheck > 30000) { lastServerCheck = Date.now(); checkServer(); }
});
state.project = readHash();
state.detailLoading = !!state.project;
loadProjects().then(() => applyProject(state.project));
connectEvents();
</script>
