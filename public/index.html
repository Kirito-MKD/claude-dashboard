<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='.55' stop-color='%23ec4899'/%3E%3Cstop offset='1' stop-color='%23fb923c'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M9 22V10h3l4 7 4-7h3v12h-3v-7l-4 7-4-7v7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0b1e;
    --glass: rgba(14, 15, 40, .52);
    --glass-strong: rgba(14, 15, 38, .86);
    --card: rgba(18, 18, 46, .56);
    --card-hover: rgba(26, 26, 60, .64);
    --input: rgba(8, 8, 24, .6);
    --border: rgba(196, 181, 253, .14);
    --border-strong: rgba(196, 181, 253, .3);
    --text: #f2eefc;
    --text-2: #d2cbec;
    --muted: #a39dc6;
    --accent: #ff9e6d;
    --accent-soft: rgba(255, 158, 109, .16);
    --pink: #f580bd;
    --pink-soft: rgba(245, 128, 189, .15);
    --violet: #b49bff;
    --violet-soft: rgba(180, 155, 255, .16);
    --sky: #93c8ff;
    --sky-soft: rgba(147, 200, 255, .14);
    --ok: #74e8bd;
    --ok-soft: rgba(116, 232, 189, .14);
    --danger: #ff7b90;
    --grad: linear-gradient(90deg, #8b5cf6 0%, #ec4899 55%, #fb923c 100%);
    --radius: 12px;
    --blur: blur(18px) saturate(150%);
    /* пружины в духе motion/react: лёгкий перелёт и мягкая посадка */
    --spring: cubic-bezier(.3, 1.3, .5, 1);
    --spring-soft: cubic-bezier(.25, 1.18, .45, 1);
    --spring-pop: cubic-bezier(.34, 1.56, .64, 1);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  /* фон: картинка из public/background.jpg, слегка размытая и притемнённая для читаемости */
  .bg-wrap { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .bg, .bg-shade { position: absolute; }
  /* слой шире экрана, чтобы размытие не давало светлых краёв; обрезается .bg-wrap */
  .bg { inset: -30px; background: url(background.jpg) center 40% / cover no-repeat; filter: blur(4px) saturate(120%); }
  .bg-shade { inset: 0; background: linear-gradient(180deg, rgba(10, 11, 30, .12) 0%, rgba(10, 11, 30, .28) 55%, rgba(10, 11, 30, .5) 100%); }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--sky); }
  ::selection { background: rgba(236, 72, 153, .35); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(196, 181, 253, .22); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }
  .glass { background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-bottom: 1px solid var(--border); }
  .logo { width: 26px; height: 26px; border-radius: 8px; background: var(--grad); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; box-shadow: 0 0 18px rgba(236, 72, 153, .45); }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  .live { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
  .live.on i { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }

  /* ---------- layout ---------- */
  .layout { display: grid; grid-template-columns: 272px minmax(0, 1fr) 410px; min-height: 0; }
  aside, #feed, #notes { min-height: 0; overflow-y: auto; }
  .main-col { display: contents; }
  aside { border-right: 1px solid var(--border); padding: 12px 10px 24px; }
  #notes { border-left: 1px solid var(--border); padding: 16px; }
  #feed { padding: 18px 24px 48px; }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 14px 10px 6px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .section-title:first-child { margin-top: 4px; }

  /* ---------- проекты ---------- */
  .proj {
    position: relative; display: block; width: 100%; text-align: left; border: 1px solid transparent;
    border-radius: 10px; padding: 8px 10px; margin-bottom: 2px; cursor: pointer; outline: none;
  }
  .proj:hover, .proj:focus-visible { background: rgba(196, 181, 253, .07); }
  .proj.active { background: rgba(196, 181, 253, .12); border-color: var(--border-strong); }
  .proj.archived .proj-name { color: var(--text-2); }
  .proj-row { display: flex; align-items: center; gap: 6px; }
  .proj-name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-name .pin-mark { color: var(--accent); margin-left: 4px; vertical-align: -2px; }
  .proj-status { color: var(--text-2); font-size: 12px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .proj-meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .mini { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
  .mini-bar { flex: 1; height: 4px; border-radius: 4px; background: rgba(196, 181, 253, .14); overflow: hidden; }
  .mini-bar i { display: block; height: 100%; background: var(--grad); border-radius: 4px; }
  .mini span { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 30px; text-align: right; }
  .proj-actions { position: absolute; top: 6px; right: 6px; display: none; gap: 2px; background: var(--glass-strong); border-radius: 8px; padding: 2px; border: 1px solid var(--border); }
  .proj:hover .proj-actions, .proj:focus-within .proj-actions { display: flex; }
  .pill { font-size: 11px; font-weight: 600; border-radius: 99px; padding: 1px 7px; background: rgba(196, 181, 253, .12); color: var(--muted); white-space: nowrap; }
  .pill.notes { background: var(--accent-soft); color: var(--accent); }
  .empty-side { color: var(--muted); font-size: 12.5px; padding: 8px 10px; }
  details.archive > summary { list-style: none; cursor: pointer; user-select: none; }
  details.archive > summary::-webkit-details-marker { display: none; }
  details.archive > summary .chev { transition: transform .15s; }
  details.archive[open] > summary .chev { transform: rotate(90deg); }
  details.archive > summary:hover { color: var(--text-2); }

  .icon-btn {
    background: none; border: none; color: var(--muted); border-radius: 6px; width: 26px; height: 26px;
    display: inline-grid; place-items: center; padding: 0; font-size: 15px; line-height: 1;
  }
  .icon-btn:hover { background: rgba(196, 181, 253, .14); color: var(--text); }
  .icon-btn.danger:hover { color: var(--danger); }
  .icon-btn.on { color: var(--accent); }

  /* ---------- шапка проекта ---------- */
  .feed-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .feed-head h2 { margin: 0; font-size: 20px; font-weight: 650; text-shadow: 0 2px 12px rgba(0, 0, 0, .5); }
  .feed-head .sub { color: var(--text-2); font-size: 12.5px; text-shadow: 0 1px 6px rgba(0, 0, 0, .6); }
  .head-actions { margin-left: auto; display: flex; gap: 6px; }
  .ghost-btn {
    display: inline-flex; align-items: center; gap: 6px; border-radius: 8px; padding: 5px 10px; font-size: 12.5px;
    background: var(--glass); border: 1px solid var(--border); color: var(--text-2);
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
  }
  .ghost-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .ghost-btn.on { color: var(--accent); border-color: rgba(255, 158, 109, .4); }
  .tag { font-size: 11.5px; border-radius: 6px; padding: 2px 8px; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
  .tag.archived { background: rgba(196, 181, 253, .14); color: var(--text-2); }
  .tag.pinned { background: var(--accent-soft); color: var(--accent); }
  .project-status {
    background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--border); border-left: 3px solid var(--sky);
    border-radius: var(--radius); padding: 9px 14px; margin-bottom: 12px; font-size: 13px; white-space: pre-wrap; color: var(--text-2);
  }
  .project-status b { color: var(--sky); font-weight: 600; margin-right: 6px; }

  /* ---------- этапы: степпер (по мотивам Stepper03) ---------- */
  .progress-card { border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px 14px; margin-bottom: 18px; }
  .pc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .pc-title { font-weight: 600; color: var(--text-2); font-size: 13px; }
  .pc-percent { font-size: 22px; font-weight: 700; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-variant-numeric: tabular-nums; }
  .pc-head .ghost-btn { margin-left: auto; }
  .stepper-scroll { overflow-x: auto; margin: 0 -8px; padding: 2px 8px 4px; }
  .stepper { position: relative; min-width: calc(var(--n) * 86px); --half: calc(50% / var(--n)); }
  .st-track, .st-fill { position: absolute; top: 19px; height: 3px; left: var(--half); right: var(--half); border-radius: 3px; }
  .st-track { background: rgba(196, 181, 253, .16); }
  .st-fill {
    background: var(--grad); transform-origin: left center; transform: scaleX(var(--p, 0));
    transition: transform .95s var(--spring); box-shadow: 0 0 12px rgba(236, 72, 153, .45);
  }
  .st-dot {
    position: absolute; z-index: 4; top: 20.5px; width: 9px; height: 9px; border-radius: 50%; pointer-events: none;
    left: calc(var(--half) + var(--p, 0) * (100% - 2 * var(--half))); transform: translate(-50%, -50%);
    background: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .16), 0 0 14px 2px rgba(255, 196, 150, .9);
    transition: left .95s var(--spring-soft);
  }
  .st-steps { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
  .st-step { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; --c: #8b5cf6; }
  .st-node { position: relative; z-index: 3; width: 40px; height: 40px; border-radius: 50%; border: none; padding: 0; background: none; display: grid; place-items: center; cursor: pointer; outline: none; }
  .st-node:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--violet); }
  .st-bg { position: absolute; inset: 0; border-radius: 50%; background: rgba(28, 27, 64, .94); border: 1px solid var(--border-strong); transition: background .3s, border-color .3s, box-shadow .3s; }
  .st-step.todo .st-node:hover .st-bg { background: rgba(52, 48, 104, .96); }
  .st-step.done .st-bg, .st-step.active .st-bg { background: var(--c); border-color: transparent; }
  .st-step.active .st-bg { box-shadow: 0 0 20px color-mix(in srgb, var(--c) 75%, transparent); }
  .st-ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 65%, transparent); animation: st-pulse 1.1s ease-in-out infinite alternate; }
  @keyframes st-pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(1.45); opacity: .2; } }
  .st-inner { position: relative; display: grid; place-items: center; transition: transform .45s var(--spring-pop); color: var(--muted); }
  .st-step.viewing .st-inner { transform: scale(1.12); }
  .st-step.done .st-inner, .st-step.active .st-inner { color: #fff; }
  .st-inner svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .st-step.done .st-inner svg { stroke-width: 3; }
  .st-inner.pop svg { animation: st-check .55s var(--spring-pop) var(--d, 0ms) both; }
  .st-inner.appear svg { animation: st-icon .45s var(--spring-pop) var(--d, 0ms) both; }
  @keyframes st-check { from { transform: scale(0) rotate(-90deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes st-icon { from { transform: scale(0); opacity: 0; } to { transform: none; opacity: 1; } }
  .st-label {
    font-size: 12px; font-weight: 500; color: var(--muted); text-align: center; max-width: 100%; padding: 0 4px; line-height: 1.3;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; transition: color .3s; cursor: pointer;
  }
  .st-step.done .st-label, .st-step.active .st-label { color: var(--text-2); }
  .st-step.viewing .st-label { color: #fff; font-weight: 650; }
  .st-content { min-height: 96px; margin-top: 20px; }
  .st-sep { height: 1px; background: var(--border); margin: 14px 0 12px; }
  .st-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .st-nav .count { color: var(--muted); font-size: 12.5px; }
  .st-nav .btn svg, .st-nav .ghost-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .st-nav button:disabled { opacity: .45; cursor: default; filter: none; box-shadow: none; }
  .stages-empty { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .ghost-steps { display: flex; align-items: center; flex: none; }
  .ghost-steps span { width: 26px; height: 26px; border-radius: 50%; border: 2px dashed rgba(196, 181, 253, .35); }
  .ghost-steps i { width: 26px; height: 0; border-top: 2px dashed rgba(196, 181, 253, .25); }
  .stages-empty .t { font-weight: 600; }
  .stages-empty .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  @media (prefers-reduced-motion: reduce) {
    .st-ring { animation: none; }
    .st-fill, .st-dot, .st-inner { transition: none; }
    .st-inner.pop svg, .st-inner.appear svg { animation: none; }
  }
  .sd-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .sd-num { color: var(--muted); font-size: 12px; }
  .sd-title { font-weight: 650; font-size: 15px; }
  .st-pill { font-size: 11px; font-weight: 600; border-radius: 99px; padding: 1px 8px; }
  .st-pill.done { background: var(--ok-soft); color: var(--ok); }
  .st-pill.active { background: var(--pink-soft); color: var(--pink); }
  .st-pill.todo { background: rgba(196, 181, 253, .12); color: var(--muted); }
  .sd-actions { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .sd-block { margin-top: 10px; }
  .sd-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .sd-tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .sd-tasks li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; background: rgba(8, 8, 24, .35); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
  .sd-tasks li:hover { border-color: var(--border-strong); }
  .sd-tasks time { color: var(--muted); font-size: 12px; }
  .sd-tasks .q { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sd-tasks .a { color: var(--text-2); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .muted { color: var(--muted); }

  /* ---------- лента ---------- */
  .day { font-size: 12px; color: var(--text-2); font-weight: 600; margin: 20px 2px 8px; text-transform: uppercase; letter-spacing: .07em; text-shadow: 0 1px 6px rgba(0, 0, 0, .7); }
  .task {
    background: var(--card); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; position: relative;
    transition: border-color .15s, box-shadow .3s;
  }
  .task:hover { border-color: var(--border-strong); }
  .task.flash { box-shadow: 0 0 0 2px var(--violet), 0 0 24px rgba(180, 155, 255, .4); }
  .task-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .task-meta .icon-btn { margin-left: auto; opacity: 0; }
  .task:hover .task-meta .icon-btn, .task-meta .icon-btn:focus-visible { opacity: 1; }
  .chip { background: rgba(196, 181, 253, .13); color: var(--text-2); border-radius: 6px; padding: 1px 7px; font-weight: 600; }
  .chip.link { cursor: pointer; }
  .chip.link:hover { color: var(--text); background: rgba(196, 181, 253, .22); }
  .chip.stage-chip { background: var(--violet-soft); color: var(--violet); }
  .badge { border-radius: 6px; padding: 1px 7px; font-weight: 600; font-size: 11px; }
  .badge.agent { background: var(--accent-soft); color: var(--accent); }
  .badge.hook { background: var(--sky-soft); color: var(--sky); }
  .sid { font-family: var(--mono); font-size: 11px; cursor: pointer; }
  .sid:hover { color: var(--text-2); }
  .field { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; margin-top: 6px; }
  .field .label { color: var(--muted); font-size: 12px; padding-top: 2px; }
  .req-text { white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2); }
  details.pasted { margin: 6px 0; border: 1px solid var(--border); border-radius: 8px; background: rgba(8, 8, 24, .35); white-space: normal; }
  details.pasted summary { cursor: pointer; padding: 5px 10px; font-size: 12.5px; color: var(--muted); list-style: none; display: flex; gap: 6px; align-items: center; user-select: none; }
  details.pasted summary::-webkit-details-marker { display: none; }
  details.pasted summary::before { content: "▸"; transition: transform .15s; }
  details.pasted[open] summary::before { transform: rotate(90deg); }
  details.pasted summary .first { color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  details.pasted pre { margin: 0; padding: 8px 12px 10px; font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2); border-top: 1px solid var(--border); }
  .clp-inner { overflow-wrap: anywhere; }
  .clp.collapsed .clp-inner { max-height: var(--clp-max); overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000 65%, transparent); mask-image: linear-gradient(180deg, #000 65%, transparent); }
  .more { background: none; border: none; padding: 0; color: var(--sky); font-size: 12px; margin-top: 4px; }
  .more:hover { text-decoration: underline; }
  .status-line { margin-top: 8px; font-size: 12.5px; color: var(--text-2); }
  .status-line b { color: var(--sky); font-weight: 600; }
  details.files { margin-top: 8px; }
  details.files summary { cursor: pointer; color: var(--muted); font-size: 12.5px; user-select: none; list-style: none; display: inline-flex; gap: 6px; align-items: center; }
  details.files summary::-webkit-details-marker { display: none; }
  details.files summary::before { content: "▸"; transition: transform .15s; display: inline-block; }
  details.files[open] summary::before { transform: rotate(90deg); }
  details.files summary:hover { color: var(--text-2); }
  details.files ul { margin: 6px 0 0; padding: 8px 10px; list-style: none; background: rgba(8, 8, 24, .45); border-radius: 8px; border: 1px solid var(--border); }
  details.files li { font-family: var(--mono); font-size: 12px; color: var(--text-2); padding: 1px 0; overflow-wrap: anywhere; }
  details.files li .dir { color: var(--muted); }
  .empty { color: var(--text-2); text-align: center; padding: 50px 20px; border: 1px dashed var(--border-strong); border-radius: var(--radius); background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
  .empty code { font-family: var(--mono); font-size: 12px; background: rgba(196, 181, 253, .12); padding: 2px 6px; border-radius: 5px; }
  .load-more { display: block; margin: 14px auto 0; }

  /* ---------- markdown ---------- */
  .md { overflow-wrap: anywhere; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 8px; }
  .md ul, .md ol { margin: 0 0 8px; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md li > ul, .md li > ol { margin: 2px 0 0; }
  .md li::marker { color: var(--muted); }
  .md strong { color: #fff; font-weight: 650; }
  .md em { color: var(--text); }
  .md code { font-family: var(--mono); font-size: 12px; background: rgba(196, 181, 253, .14); color: #f6dcff; padding: 1px 5px; border-radius: 5px; }
  .md .md-pre { background: rgba(6, 6, 20, .6); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; overflow-x: auto; margin: 0 0 8px; }
  .md .md-pre code { background: none; padding: 0; color: var(--text-2); white-space: pre; }
  .md .md-h { font-weight: 650; color: #fff; margin: 12px 0 6px; }
  .md .md-h1, .md .md-h2 { font-size: 15px; }
  .md .md-h3, .md .md-h4, .md .md-h5, .md .md-h6 { font-size: 14px; }
  .md blockquote { margin: 0 0 8px; padding: 2px 12px; border-left: 3px solid var(--violet); color: var(--text-2); }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .md .md-table { overflow-x: auto; margin: 2px 0 10px; border: 1px solid var(--border); border-radius: 8px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 12.8px; }
  .md th, .md td { padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; text-align: left; }
  .md th { background: rgba(196, 181, 253, .1); color: var(--text); font-weight: 600; white-space: nowrap; }
  .md tr:last-child td { border-bottom: none; }
  .md tbody tr:nth-child(even) td { background: rgba(196, 181, 253, .04); }
  .md .md-check { color: var(--muted); }
  .md .md-check.done { color: var(--ok); }
  .md del { color: var(--muted); }

  /* ---------- правки ---------- */
  #notes h2 { font-size: 16px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .composer { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; margin-bottom: 16px; }
  .composer:focus-within { border-color: var(--border-strong); }
  .composer input[type=text], .composer textarea, .modal input, .modal textarea, .modal select {
    width: 100%; background: var(--input); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; outline: none;
  }
  .composer input[type=text]:focus, .composer textarea:focus, .modal input:focus, .modal textarea:focus, .modal select:focus { border-color: rgba(196, 181, 253, .5); }
  .composer textarea { resize: vertical; min-height: 88px; margin-top: 8px; display: block; }
  .interim { color: var(--muted); font-style: italic; font-size: 12.5px; margin-top: 4px; }
  .interim:empty { display: none; }
  .attachments { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .attachments:empty { display: none; }
  .thumb { position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); background: var(--input); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; cursor: zoom-in; }
  .thumb .x, .audio-att .x {
    position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; border: none;
    background: rgba(0, 0, 0, .7); color: #fff; font-size: 13px; line-height: 20px; padding: 0;
  }
  .audio-att { position: relative; display: flex; align-items: center; gap: 6px; width: 100%; background: var(--input); border: 1px solid var(--border); border-radius: 8px; padding: 4px 30px 4px 6px; }
  .audio-att audio { height: 32px; width: 100%; }
  .audio-att .x { top: 50%; transform: translateY(-50%); right: 5px; }
  .composer-actions { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .btn {
    background: rgba(196, 181, 253, .1); border: 1px solid var(--border-strong); border-radius: 8px; padding: 6px 11px;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .btn:hover { border-color: rgba(196, 181, 253, .5); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--grad); border-color: transparent; color: #fff; font-weight: 600; box-shadow: 0 4px 16px rgba(236, 72, 153, .3); }
  .btn.primary:hover { filter: brightness(1.08); }
  .composer-actions .btn.primary { margin-left: auto; }
  .btn.rec.recording { background: rgba(255, 123, 144, .16); border-color: var(--danger); color: #ffc1cb; }
  .btn.rec.recording .dot { animation: pulse 1s infinite; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); display: inline-block; }
  @keyframes pulse { 50% { opacity: .25; } }
  .timer { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
  .level { display: inline-flex; gap: 2px; align-items: flex-end; height: 16px; }
  .level i { width: 3px; border-radius: 2px; background: var(--pink); height: 3px; transition: height .08s; }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  .hint kbd { font-family: var(--mono); font-size: 10.5px; background: rgba(196, 181, 253, .12); border: 1px solid var(--border-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  .hint.warn { color: #ffcf8a; }
  .hint .btn { margin-top: 6px; font-size: 12px; padding: 4px 9px; }

  .note {
    display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; padding: 10px 10px 10px 8px;
    border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); margin-bottom: 8px;
  }
  .note input[type=checkbox] { width: 16px; height: 16px; margin: 2px 0 0 2px; accent-color: var(--ok); cursor: pointer; }
  .note-text { white-space: pre-wrap; overflow-wrap: anywhere; outline: none; border-radius: 6px; }
  .note-text[contenteditable=plaintext-only], .note-text[contenteditable=true] { background: var(--input); box-shadow: 0 0 0 1px rgba(196, 181, 253, .5); padding: 2px 4px; }
  .note-text.placeholder { color: var(--muted); font-style: italic; }
  .note audio { width: 100%; height: 32px; margin-top: 6px; display: block; }
  .note .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .note .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; }
  .note-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: var(--muted); font-size: 11.5px; flex-wrap: wrap; }
  .note-meta .icon-btn { width: 22px; height: 22px; font-size: 14px; opacity: 0; }
  .note:hover .note-meta .icon-btn, .note-meta .icon-btn:focus-visible { opacity: 1; }
  .note-meta .push { margin-left: auto; }
  .note.done { background: rgba(14, 15, 38, .4); }
  .note.done .note-text { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(163, 157, 198, .5); }
  .by { border-radius: 6px; padding: 1px 7px; font-weight: 600; font-size: 11px; display: inline-flex; gap: 4px; align-items: center; }
  .by.claude { background: var(--accent-soft); color: var(--accent); }
  .by.user { background: var(--ok-soft); color: var(--ok); }
  .by.unknown { background: rgba(196, 181, 253, .12); color: var(--muted); }
  details.done-list summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin: 14px 0 8px; user-select: none; }
  .notes-empty { color: var(--muted); font-size: 12.5px; padding: 6px 2px; }

  /* ---------- плашка: сервер устарел ---------- */
  /* в потоке ленты (а не поверх), чтобы не закрывать кнопки шапки проекта */
  .server-banner {
    position: sticky; top: 0; z-index: 6; margin-bottom: 14px; flex-wrap: wrap;
    display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px;
    background: rgba(46, 24, 34, .9); border: 1px solid rgba(255, 207, 138, .5); color: #ffe6c4;
    backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: 0 12px 40px rgba(0, 0, 0, .5);
    animation: banner-in .45s var(--spring-pop);
  }
  @keyframes banner-in { from { opacity: 0; transform: translateY(-10px); } }
  .server-banner .msg { flex: 1 1 260px; font-size: 13px; }
  .server-banner code { font-family: var(--mono); background: rgba(0, 0, 0, .35); padding: 1px 6px; border-radius: 5px; color: #fff; }
  .server-banner .btn { flex: none; }

  /* ---------- оверлеи ---------- */
  #drop { position: fixed; inset: 0; background: rgba(10, 11, 30, .82); border: 3px dashed var(--pink); display: none; place-items: center; z-index: 50; font-size: 18px; pointer-events: none; }
  #drop.show { display: grid; }
  #lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, .88); display: none; place-items: center; z-index: 60; cursor: zoom-out; padding: 24px; }
  #lightbox.show { display: grid; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: 0 10px 40px rgba(0, 0, 0, .6); }
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; max-width: min(560px, calc(100vw - 32px));
    background: var(--glass-strong); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 14px; transition: .2s; z-index: 70; pointer-events: none; font-size: 13px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%); }
  #toast.error { border-color: var(--danger); color: #ffd0d7; }
  dialog.modal {
    width: min(720px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; color: var(--text);
    background: var(--glass-strong); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--border-strong); border-radius: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
  }
  dialog.modal::backdrop { background: rgba(5, 5, 18, .6); }
  .modal-body { padding: 18px 18px 0; overflow-y: auto; max-height: calc(100vh - 140px); }
  .modal h3 { margin: 0 0 4px; font-size: 16px; }
  .modal .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }
  .se-row { display: grid; grid-template-columns: 128px minmax(0, 1fr) auto; gap: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: rgba(8, 8, 24, .3); }
  .se-row textarea { grid-column: 2 / 3; resize: vertical; min-height: 38px; font-size: 13px; }
  .se-row .se-icon { grid-column: 1; grid-row: 2; align-self: start; font-size: 13px; }
  .se-row .se-tools { grid-row: 1 / 3; grid-column: 3; display: flex; flex-direction: column; gap: 2px; }
  .se-progress { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; color: var(--text-2); font-size: 13px; }
  .se-progress input { width: 90px !important; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 18px 18px; }

  /* ---------- адаптив ---------- */
  @media (max-width: 1220px) {
    .layout { grid-template-columns: 240px minmax(0, 1fr); }
    .main-col { display: block; overflow-y: auto; min-height: 0; }
    #feed, #notes { overflow: visible; }
    #notes { border-left: none; border-top: 1px solid var(--border); }
  }
  @media (max-width: 760px) {
    body { overflow: auto; display: block; }
    .layout { display: block; }
    aside { border-right: none; border-bottom: 1px solid var(--border); display: flex; gap: 6px; overflow-x: auto; padding: 8px; align-items: flex-start; }
    aside > .section-title { display: none; }
    aside details.archive { flex: none; min-width: 160px; }
    aside details.archive > summary { margin: 8px 6px; }
    .proj { width: auto; min-width: 160px; max-width: 220px; flex: none; }
    .proj-actions { display: flex; position: static; margin-top: 6px; width: max-content; }
    #feed { padding: 14px 16px; }
    #notes { padding: 14px 16px; }
    .main-col { overflow: visible; }
    .field { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .task-meta .icon-btn, .note-meta .icon-btn { opacity: 1; }
    .head-actions { margin-left: 0; width: 100%; }
    .se-row { grid-template-columns: 1fr auto; }
    .se-row select { grid-column: 1; }
    .se-row input { grid-column: 1; }
    .se-row textarea { grid-column: 1; }
    .se-row .se-icon { grid-column: 1; grid-row: auto; }
    .se-row .se-tools { grid-row: 1 / 4; grid-column: 2; }
  }
</style>
</head>
<body>
<div class="bg-wrap" aria-hidden="true"><div class="bg"></div><div class="bg-shade"></div></div>

<header class="glass">
  <div class="logo">A</div>
  <h1>Agent Dashboard</h1>
  <div class="live" id="live" title="Живые обновления с сервера"><i></i><span>нет связи</span></div>
</header>

<div class="layout">
  <aside id="projects" class="glass" aria-label="Проекты"></aside>
  <div class="main-col">
    <section id="feed" aria-label="Лента задач">
      <div id="server-banner" class="server-banner" role="alert" hidden></div>
      <div id="feed-head"></div>
      <div id="project-progress" hidden></div>
      <div id="feed-list"></div>
    </section>
    <section id="notes" class="glass" aria-label="Правки">
      <h2>Правки <span class="pill notes" id="notes-count" hidden></span></h2>
      <form class="composer" id="composer" autocomplete="off">
        <input type="text" id="note-project" list="project-names" placeholder="Проект" required aria-label="Проект">
        <datalist id="project-names"></datalist>
        <textarea id="note-text" placeholder="Что поправить? Надиктуйте голосом или напишите. Скриншоты — Ctrl+V или перетащите сюда."></textarea>
        <div class="interim" id="interim"></div>
        <div class="attachments" id="attachments"></div>
        <div class="composer-actions">
          <button type="button" class="btn rec" id="rec-btn" title="Запись голоса с расшифровкой"><span class="dot"></span><span id="rec-label">Голос</span></button>
          <span class="timer" id="rec-timer" hidden>0:00</span>
          <span class="level" id="rec-level" hidden><i></i><i></i><i></i><i></i><i></i></span>
          <label class="btn" title="Прикрепить картинки">📎<input type="file" id="file-input" accept="image/*" multiple hidden></label>
          <button type="submit" class="btn primary" id="submit-btn">Добавить</button>
        </div>
        <div class="hint" id="composer-hint"></div>
      </form>
      <div id="notes-open"></div>
      <details class="done-list" id="notes-done-wrap" hidden>
        <summary id="notes-done-title">Сделано</summary>
        <div id="notes-done"></div>
      </details>
    </section>
  </div>
</div>

<dialog class="modal" id="stage-editor">
  <form method="dialog" id="stage-form">
    <div class="modal-body">
      <h3 id="se-title">Этапы проекта</h3>
      <div class="sub">Этапы показываются на шкале готовности. Claude видит их в начале сессии и привязывает к ним задачи. Иконка «Авто» подбирается по названию.</div>
      <div id="se-rows"></div>
      <button type="button" class="btn" id="se-add">+ Добавить этап</button>
      <label class="se-progress">Готовность проекта:
        <input type="number" id="se-progress" min="0" max="100" placeholder="авто"> %
        <span class="muted">— пусто: считать по этапам</span>
      </label>
      <label class="se-progress"><input type="checkbox" id="se-skip"> Не требовать план от агентов для этого проекта</label>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn" id="se-cancel">Отмена</button>
      <button type="submit" class="btn primary" id="se-save">Сохранить</button>
    </div>
  </form>
</dialog>

<div id="drop">Отпустите, чтобы прикрепить к правке</div>
<div id="lightbox"><img alt=""></div>
<div id="toast" role="status"></div>

<script>
'use strict';

/* markdown:start — безопасный рендер Markdown: весь текст экранируется, ссылки только http(s)/mailto */
const Markdown = (() => {
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const UNESC = { amp: '&', lt: '<', gt: '>', quot: '"', '#39': "'" };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ESC[c]);
  const unesc = (s) => s.replace(/&(amp|lt|gt|quot|#39);/g, (m, e) => UNESC[e]);
  const SAFE_URL = /^(https?:\/\/|mailto:)/i;
  const link = (href, label) => `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${label}</a>`;

  function inline(text) {
    const slots = [];
    const hold = (html) => `\u0000${slots.push(html) - 1}\u0000`;
    let s = String(text);
    s = s.replace(/``(.+?)``/g, (m, c) => hold(`<code>${esc(c.trim())}</code>`));
    s = s.replace(/`([^`\n]+?)`/g, (m, c) => hold(`<code>${esc(c)}</code>`));
    s = esc(s);
    s = s.replace(/\[([^\]\n]+)\]\(\s*([^)\s]+)\s*\)/g, (m, label, url) => {
      const u = unesc(url);
      return SAFE_URL.test(u) ? hold(link(u, label)) : m;
    });
    s = s.replace(/\bhttps?:\/\/[^\s<>()\u0000]*[^\s<>()\u0000.,;:!?'"»]/g, (u) => {
      const clean = u.replace(/&quot;.*$/, '');
      return hold(link(unesc(clean), clean)) + u.slice(clean.length);
    });
    s = s.replace(/\*\*(?=\S)([^\n]*?\S)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^\w])__(?=\S)([^\n]*?\S)__(?!\w)/g, '$1<strong>$2</strong>');
    s = s.replace(/(^|[^*\w])\*(?=[^\s*])([^*\n]*?[^\s*])\*(?![*\w])/g, '$1<em>$2</em>');
    s = s.replace(/(^|[^\w])_(?=[^\s_])([^_\n]*?[^\s_])_(?!\w)/g, '$1<em>$2</em>');
    s = s.replace(/~~(?=\S)([^\n]*?\S)~~/g, '<del>$1</del>');
    for (let guard = 0; s.includes('\u0000') && guard < 5; guard++) {
      s = s.replace(/\u0000(\d+)\u0000/g, (m, i) => slots[+i]);
    }
    return s;
  }

  const RE = {
    fence: /^\s{0,3}(`{3,}|~{3,})\s*[^`]*$/,
    heading: /^\s{0,3}(#{1,6})\s+(.*?)\s*#*\s*$/,
    hr: /^\s{0,3}([-*_])(?:\s*\1){2,}\s*$/,
    list: /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/,
    quote: /^\s{0,3}>\s?(.*)$/,
    tableSep: /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/,
  };
  const isTableStart = (lines, i) => lines[i].includes('|') && i + 1 < lines.length
    && lines[i + 1].includes('|') && lines[i + 1].includes('-') && RE.tableSep.test(lines[i + 1]);
  const startsBlock = (lines, i) => {
    const l = lines[i];
    return RE.fence.test(l) || RE.heading.test(l) || RE.hr.test(l) || RE.list.test(l) || RE.quote.test(l) || isTableStart(lines, i);
  };

  function splitRow(line) {
    let s = line.trim();
    if (s.startsWith('|')) s = s.slice(1);
    if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
    const cells = [];
    let cur = '';
    let inCode = false;
    for (let k = 0; k < s.length; k++) {
      const ch = s[k];
      if (ch === '\\' && s[k + 1] === '|') { cur += '|'; k++; continue; }
      if (ch === '`') inCode = !inCode;
      if (ch === '|' && !inCode) { cells.push(cur.trim()); cur = ''; continue; }
      cur += ch;
    }
    cells.push(cur.trim());
    return cells;
  }

  function table(lines, i) {
    const head = splitRow(lines[i]);
    const aligns = splitRow(lines[i + 1]).map((c) => (/^:-+:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : ''));
    let j = i + 2;
    const rows = [];
    while (j < lines.length && lines[j].trim() && lines[j].includes('|')) rows.push(splitRow(lines[j++]));
    const cell = (tag, c, k) => `<${tag}${aligns[k] ? ` style="text-align:${aligns[k]}"` : ''}>${inline(c)}</${tag}>`;
    const html = `<div class="md-table"><table><thead><tr>${head.map((c, k) => cell('th', c, k)).join('')}</tr></thead>`
      + `<tbody>${rows.map((r) => `<tr>${head.map((_, k) => cell('td', r[k] || '', k)).join('')}</tr>`).join('')}</tbody></table></div>`;
    return { html, next: j };
  }

  function itemContent(text) {
    let box = '';
    const m = text.match(/^\[([ xX])\]\s+/);
    if (m) {
      box = m[1] === ' ' ? '<span class="md-check">☐</span> ' : '<span class="md-check done">☑</span> ';
      text = text.slice(m[0].length);
    }
    return box + text.split('\n').map(inline).join('<br>');
  }

  function buildList(items) {
    let html = '';
    const stack = [];
    const open = (it) => `<${it.ordered ? 'ol' : 'ul'}${it.ordered && it.start > 1 ? ` start="${it.start}"` : ''}>`;
    for (const it of items) {
      const tag = it.ordered ? 'ol' : 'ul';
      while (stack.length > 1 && it.indent < stack[stack.length - 1].indent) html += `</li></${stack.pop().tag}>`;
      const top = stack[stack.length - 1];
      if (!top || it.indent > top.indent + 1) {
        html += open(it);
        stack.push({ indent: it.indent, tag });
      } else if (top.tag !== tag) {
        html += `</li></${top.tag}>${open(it)}`;
        top.tag = tag;
      } else {
        html += '</li>';
      }
      html += `<li>${itemContent(it.text)}`;
    }
    while (stack.length) html += `</li></${stack.pop().tag}>`;
    return html;
  }

  function list(lines, i) {
    const items = [];
    while (i < lines.length) {
      const line = lines[i];
      const m = line.match(RE.list);
      if (m && !RE.hr.test(line)) {
        items.push({ indent: m[1].replace(/\t/g, '    ').length, ordered: /\d/.test(m[2]), start: parseInt(m[2], 10), text: m[3] });
        i++;
        continue;
      }
      if (!line.trim()) {
        let j = i + 1;
        while (j < lines.length && !lines[j].trim()) j++;
        if (j < lines.length && (RE.list.test(lines[j]) || /^\s{2,}\S/.test(lines[j])) && !RE.hr.test(lines[j])) { i = j; continue; }
        break;
      }
      if (items.length && (/^\s{2,}\S/.test(line) || !startsBlock(lines, i))) {
        items[items.length - 1].text += '\n' + line.trim();
        i++;
        continue;
      }
      break;
    }
    return { html: buildList(items), next: i };
  }

  function blocks(lines) {
    const out = [];
    let i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }
      let m = line.match(RE.fence);
      if (m) {
        const close = new RegExp(`^\\s{0,3}${m[1][0] === '`' ? '`' : '~'}{${m[1].length},}\\s*$`);
        const buf = [];
        i++;
        while (i < lines.length && !close.test(lines[i])) buf.push(lines[i++]);
        i++;
        out.push(`<pre class="md-pre"><code>${esc(buf.join('\n'))}</code></pre>`);
        continue;
      }
      if ((m = line.match(RE.heading))) { out.push(`<div class="md-h md-h${m[1].length}">${inline(m[2])}</div>`); i++; continue; }
      if (RE.hr.test(line)) { out.push('<hr>'); i++; continue; }
      if (isTableStart(lines, i)) { const t = table(lines, i); out.push(t.html); i = t.next; continue; }
      if (RE.quote.test(line)) {
        const buf = [];
        while (i < lines.length && RE.quote.test(lines[i])) buf.push(lines[i++].match(RE.quote)[1]);
        out.push(`<blockquote>${blocks(buf)}</blockquote>`);
        continue;
      }
      if (RE.list.test(line)) { const l = list(lines, i); out.push(l.html); i = l.next; continue; }
      const buf = [];
      while (i < lines.length && lines[i].trim() && !(buf.length && startsBlock(lines, i))) buf.push(lines[i++].trim());
      out.push(`<p>${buf.map(inline).join('<br>')}</p>`);
    }
    return out.join('');
  }

  return {
    render: (src) => blocks(String(src == null ? '' : src).replace(/\u0000/g, '').replace(/\r\n?/g, '\n').split('\n')),
    inline,
    esc,
  };
})();
/* markdown:end */

const $ = (sel) => document.querySelector(sel);

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) {
    if (c === undefined || c === null || c === false || c === '') continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  if (res.status === 204) return null;
  const body = await res.json().catch(() => ({}));
  if (res.status === 404 && body.error === 'Нет такого API') {
    // интерфейс новее запущенного сервера: старый процесс не знает этот адрес
    showServerBanner('old');
    throw new Error('Сервер дашборда устарел — перезапустите его: npm run restart в папке дашборда');
  }
  if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
  return body;
}

const UI_API_LEVEL = 3;

function showServerBanner(kind) {
  const banner = $('#server-banner');
  if (banner.dataset.kind === kind && !banner.hidden) return;
  banner.dataset.kind = kind;
  const copyBtn = el('button', { class: 'ghost-btn', type: 'button', onclick: () => navigator.clipboard?.writeText('npm run restart').then(() => toast('Команда скопирована')) }, 'Скопировать команду');
  if (kind === 'old') {
    banner.replaceChildren(
      el('div', { class: 'msg' }, 'Запущена старая версия сервера дашборда — закрепление, архив и этапы не заработают, пока его не перезапустить. В папке дашборда выполните ', el('code', {}, 'npm run restart'), '.'),
      copyBtn,

    banner.replaceChildren(

function hideServerBanner() { $('#server-banner').hidden = true; }

async function fetchHealth() {
  try {
    const res = await fetch('/api/health', { cache: 'no-store' });
    return res.ok ? await res.json() : null;
  } catch {
    return null;
  }
}

async function checkServer() {
  const h = await fetchHealth();
  if (!h) return;
  serverInfo = h;
  if (h.api > UI_API_LEVEL && !sessionStorage.getItem('reloadedForApi' + h.api)) {
    // сервер новее открытой страницы — подтягиваем свежий интерфейс один раз
    sessionStorage.setItem('reloadedForApi' + h.api, '1');
    location.reload();
    return;
  }
  if (!h.api || h.api < UI_API_LEVEL) showServerBanner('old');
  else if (h.stale) showServerBanner('stale');
  else hideServerBanner();
}

async function restartServer(btn) {
  btn.disabled = true;
  btn.textContent = 'Перезапускаю…';
  const oldPid = serverInfo && serverInfo.pid;
  try { await api('/api/restart', { method: 'POST' }); } catch (e) { toast(e.message, true); }
  for (let i = 0; i < 60; i++) {
    await new Promise((r) => setTimeout(r, 500));
    const h = await fetchHealth();
    if (h && h.pid !== oldPid) { location.reload(); return; }
  }
  btn.disabled = false;
  btn.textContent = 'Перезапустить сервер';
  toast('Сервер не поднялся за 30 секунд — выполните npm run restart в папке дашборда', true);
}

const rtf = new Intl.RelativeTimeFormat('ru', { numeric: 'auto' });
function relTime(iso) {
  if (!iso) return '';
  const diff = (new Date(iso) - Date.now()) / 1000;
  const abs = Math.abs(diff);
  if (abs < 45) return 'только что';
  if (abs < 3600) return rtf.format(Math.round(diff / 60), 'minute');
  if (abs < 86400) return rtf.format(Math.round(diff / 3600), 'hour');
  if (abs < 86400 * 30) return rtf.format(Math.round(diff / 86400), 'day');
  return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
}
const fullTime = (iso) => new Date(iso).toLocaleString('ru-RU', { dateStyle: 'long', timeStyle: 'short' });
const clockTime = (iso) => new Date(iso).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
const shortDate = (iso) => new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
function dayLabel(iso) {
  const d = new Date(iso);
  const start = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((start(new Date()) - start(d)) / 86400000);
  if (days === 0) return 'Сегодня';
  if (days === 1) return 'Вчера';
  const sameYear = d.getFullYear() === new Date().getFullYear();
  return d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'long', ...(sameYear ? {} : { year: 'numeric' }) });
}
function timeEl(iso, fmt) {
  const text = fmt === 'clock' ? clockTime(iso) : fmt === 'date' ? shortDate(iso) : relTime(iso);
  return el('time', { datetime: iso, title: fullTime(iso), dataset: { fmt } }, text);
}
function refreshRelativeTimes() {
  document.querySelectorAll('time[data-fmt=rel]').forEach((t) => { t.textContent = relTime(t.getAttribute('datetime')); });
}
const plural = (n, one, few, many) => {
  const m10 = n % 10, m100 = n % 100;
  return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14) ? few : many;
};
const firstLine = (s, max = 140) => {
  const line = String(s || '').replace(/<pasted_content\b[^>]*>[\s\S]*?(<\/pasted_content\b[^>]*>|$)/g, ' ')
    .replace(/[*_`#>|]/g, '').split('\n').map((x) => x.trim()).find(Boolean) || '';
  return line.length > max ? line.slice(0, max - 1) + '…' : line;
};

// Длинный блок сворачивается с плавным затуханием; раскрытые блоки помним между перерисовками
const expanded = new Set();
function collapsible(content, maxPx, key) {
  const inner = el('div', { class: 'clp-inner' }, content);
  const box = el('div', { class: 'clp' }, inner);
  box.style.setProperty('--clp-max', maxPx + 'px');
  const wrap = el('div', {}, box);
  requestAnimationFrame(() => {
    if (inner.scrollHeight <= maxPx + 30) return;
    const isOpen = key && expanded.has(key);
    box.classList.toggle('collapsed', !isOpen);
    const btn = el('button', { class: 'more', type: 'button' }, isOpen ? 'Свернуть' : 'Показать полностью');
    btn.addEventListener('click', () => {
      const collapsed = box.classList.toggle('collapsed');
      btn.textContent = collapsed ? 'Показать полностью' : 'Свернуть';
      if (key) { if (collapsed) expanded.delete(key); else expanded.add(key); }
    });
    wrap.append(btn);
  });
  return wrap;
}

// Запрос пользователя: обычный текст, а блоки <pasted_content> — сворачиваемые вставки
function requestNode(text) {
  const box = el('div', { class: 'req-text' });
  const re = /<pasted_content\b[^>]*>([\s\S]*?)(?:<\/pasted_content\b[^>]*>|$)/g;
  let last = 0;
  let m;
  while ((m = re.exec(text)) && m[0].length) {
    const before = text.slice(last, m.index).replace(/^\n+|\s+$/g, '');
    if (before) box.append(el('span', {}, before));
    const body = m[1].replace(/^\n+|\s+$/g, '');
    const lines = body ? body.split('\n').length : 0;
    box.append(el('details', { class: 'pasted' },
      el('summary', {}, `Вставленный текст · ${lines} ${plural(lines, 'строка', 'строки', 'строк')}`,
        el('span', { class: 'first' }, firstLine(body, 70) ? `— ${firstLine(body, 70)}` : '')),
      el('pre', {}, body),
    ));
    last = re.lastIndex;
  }
  const rest = text.slice(last).replace(/^\n+/, '');
  if (rest) box.append(el('span', {}, rest));
  return box;
}

function defaultNoteProject() {

async function loadProjects() {

    state.projects = await api('/api/projects');
  } catch (e) { return toast('Не удалось загрузить проекты: ' + e.message, true); }
  renderProjects();
  const names = [...state.projects].sort((a, b) => a.archived - b.archived).map((p) => p.name);
  $('#project-names').replaceChildren(...names.map((n) => el('option', { value: n })));

let detailReq = 0;
async function loadDetail() {
  const req = ++detailReq;
  if (!state.project) { state.detail = null; state.detailLoading = false; return; }
  let detail = null;
  try { detail = await api(projectUrl(state.project)); } catch { /* новый проект без записей */ }
  if (req !== detailReq) return;
  state.detail = detail;
  state.detailLoading = false;
  renderFeed();
}

let tasksReq = 0;
async function loadTasks({ append = false } = {}) {
  const req = ++tasksReq;
  const params = new URLSearchParams();
  if (state.project) params.set('project', state.project);
  else params.set('hide_archived', '1');
  if (append && state.tasks.length) {
    params.set('before', state.tasks[state.tasks.length - 1].id);
    params.set('limit', PAGE);
  } else {
    params.set('limit', Math.min(500, Math.max(PAGE, state.tasks.length)));
  }
  let rows;
  try { rows = await api('/api/tasks?' + params); } catch (e) { return toast('Не удалось загрузить задачи: ' + e.message, true); }
  if (req !== tasksReq) return;
  state.hasMore = rows.length >= Number(params.get('limit'));
  state.tasks = append ? state.tasks.concat(rows) : rows;
  renderFeed();
}

let notesReq = 0;
async function loadNotes() {
  const req = ++notesReq;
  const params = new URLSearchParams();
  if (state.project) params.set('project', state.project);

  try { rows = await api('/api/notes?' + params); } catch (e) { return toast('Не удалось загрузить правки: ' + e.message, true); }

const ICON_FALLBACK = ['lightbulb', 'layout', 'code', 'flask', 'rocket', 'flag'];
function stageIconName(stage, i) {
  if (stage.icon && STAGE_ICONS[stage.icon] && stage.icon !== 'check') return stage.icon;
  for (const [re, name] of ICON_RULES) if (re.test(stage.title)) return name;
  return ICON_FALLBACK[i % ICON_FALLBACK.length];
}
const svgMarkup = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true">${STAGE_ICONS[name]}</svg>`;
function svgEl(name) {
  const span = document.createElement('span');
  span.innerHTML = svgMarkup(name);
  return span.firstChild;
}

// Цвет этапа — точка на градиенте заката (фиолетовый → розовый → оранжевый)
const GRAD_STOPS = [[0, [139, 92, 246]], [0.55, [236, 72, 153]], [1, [251, 146, 60]]];
function gradAt(t) {
  for (let k = 1; k < GRAD_STOPS.length; k++) {
    const [t1, c1] = GRAD_STOPS[k];
    const [t0, c0] = GRAD_STOPS[k - 1];
    if (t <= t1) {
      const f = (t - t0) / (t1 - t0 || 1);
      return `rgb(${c0.map((v, j) => Math.round(v + (c1[j] - v) * f)).join(', ')})`;
    }
  }
  return `rgb(${GRAD_STOPS[GRAD_STOPS.length - 1][1].join(', ')})`;
}

// Степпер живёт в постоянном контейнере #project-progress и обновляется на месте,
// поэтому линия, точка и иконки анимируются между состояниями, а не рисуются заново.
const stepper = { key: '', view: null, contentKey: '', shownPercent: null, anim: 0 };

function setStageStatus(stage, status) {
  return api(projectUrl(state.project, `/stages/${stage.id}`), jsonBody('PATCH', { status }))
    .then(() => { toast(`Этап «${stage.title}»: ${STAGE_WORD[status]}`); loadDetail(); loadProjects(); })
    .catch((e) => toast(e.message, true));
}

function currentStageIndex(stages) {
  const active = stages.findIndex((s) => s.status === 'active');
  if (active >= 0) return active;
  const todo = stages.findIndex((s) => s.status === 'todo');
  return todo >= 0 ? todo : stages.length - 1;
}

function stageContent(stage, index, total) {
  const tasks = stage.tasks || [];
  return el('div', {},
    el('div', { class: 'sd-head' },
      el('span', { class: 'sd-num' }, `Этап ${index + 1} из ${total}`),
      el('span', { class: 'sd-title' }, stage.title),
      el('span', { class: 'st-pill ' + stage.status }, STAGE_WORD[stage.status]),
      stage.completed_at && el('span', { class: 'muted', style: { fontSize: '12px' } }, 'завершён ', timeEl(stage.completed_at, 'date')),
      el('div', { class: 'sd-actions' },
        stage.status !== 'done' && el('button', { class: 'ghost-btn', type: 'button', onclick: () => setStageStatus(stage, 'done') }, '✓ Завершить'),
        stage.status !== 'active' && el('button', { class: 'ghost-btn', type: 'button', onclick: () => setStageStatus(stage, 'active') }, '▶ В работу'),
        stage.status === 'active' && el('button', { class: 'ghost-btn', type: 'button', onclick: () => setStageStatus(stage, 'todo') }, '○ Отложить'),
      ),
    ),
    el('div', { class: 'sd-block' },
      el('div', { class: 'sd-label' }, 'Задачи этапа'),
      stage.description ? markdownNode(stage.description) : el('div', { class: 'muted' }, 'Описание не задано — его добавит Claude при планировании или вы через «Этапы».'),
    ),
    el('div', { class: 'sd-block' },
      el('div', { class: 'sd-label' }, `Выполнено на этом этапе · ${tasks.length}`),
      tasks.length
        ? el('ul', { class: 'sd-tasks' }, tasks.map((t) => el('li', { title: 'Показать в ленте', onclick: () => revealTask(t.id) },
          timeEl(t.created_at, 'date'),
          el('div', {},
            el('div', { class: 'q' }, firstLine(t.task) || (t.source === 'hook' ? 'Сессия' : 'Задача')),
            t.summary && el('div', { class: 'a' }, firstLine(t.summary, 220)),
          ))))
        : el('div', { class: 'muted' }, 'Пока нет задач, привязанных к этапу.'),
    ),
  );
}

function stepperHead(detail) {
  const has = detail && detail.stages && detail.stages.length;
  return el('div', { class: 'pc-head' },
    el('span', { class: 'pc-title' }, 'Готовность проекта'),
    el('span', { class: 'pc-percent', id: 'pc-percent' }),
    detail && el('button', { class: 'ghost-btn', type: 'button', onclick: () => openStageEditor() }, icon('edit'), has ? 'Этапы' : 'Задать этапы'),
  );
}

function emptyStages(detail) {
  const skipped = detail && detail.plan_skipped;
  const name = state.project;
  return el('div', { class: 'stages-empty' },
    el('div', { class: 'ghost-steps', 'aria-hidden': 'true' }, el('span'), el('i'), el('span'), el('i'), el('span')),
    el('div', {},
      el('div', { class: 't' }, skipped ? 'План для проекта отключён' : 'Плана этапов пока нет'),
      el('div', { class: 'muted' }, skipped
        ? 'Вы попросили обходиться без плана — агенты не будут его составлять.'
        : 'Claude обязан составить план, как только поработает с файлами проекта (хук Stop), — или задайте этапы сами.'),
      el('div', { class: 'row' },
        el('button', { class: 'btn primary', type: 'button', onclick: () => openStageEditor() }, 'Задать этапы'),
        skipped
          ? el('button', { class: 'ghost-btn', type: 'button', onclick: () => updateProject(name, { plan_skipped: false }, 'План для проекта снова обязателен') }, 'Снова требовать план')
          : el('button', { class: 'ghost-btn', type: 'button', onclick: () => updateProject(name, { plan_skipped: true }, 'План для проекта больше не требуется') }, 'Не требовать план'),
      ),
    ),
  );
}

function buildStepper(host, detail) {
  const stages = (detail && detail.stages) || [];
  const card = el('section', { class: 'progress-card glass', 'aria-label': 'Этапы проекта' }, stepperHead(detail));
  stepper.contentKey = '';
  stepper.shownPercent = null;
  if (!stages.length) {
    if (detail || !state.detailLoading) card.append(emptyStages(detail));
    host.replaceChildren(card);
    return;
  }
  const n = stages.length;
  const steps = el('div', { class: 'st-steps' }, stages.map((s, i) => {
    const step = el('div', { class: 'st-step', dataset: { id: s.id } },
      el('button', { class: 'st-node', type: 'button', 'aria-label': `Этап ${i + 1}: ${s.title}`, onclick: () => setStepperView(s.id) },
        el('span', { class: 'st-bg' }), el('span', { class: 'st-inner' })),
      el('span', { class: 'st-label', title: s.title, onclick: () => setStepperView(s.id) }, s.title),
    );
    step.style.setProperty('--c', gradAt(n > 1 ? i / (n - 1) : 0));
    return step;
  }));
  const line = el('div', { class: 'stepper' }, el('div', { class: 'st-track' }), el('div', { class: 'st-fill' }), el('span', { class: 'st-dot' }), steps);
  line.style.setProperty('--n', n);
  line.style.setProperty('--p', 0); // при первом показе линия «вырастает» от первого этапа
  const nav = el('div', { class: 'st-nav' },
    el('button', { class: 'ghost-btn', type: 'button', id: 'st-prev', onclick: () => stepView(-1) }, svgEl('chevronLeft'), 'Назад'),
    el('span', { class: 'count', id: 'st-count' }),
    el('button', { class: 'btn primary', type: 'button', id: 'st-next', onclick: () => stepView(1) }, 'Далее', svgEl('chevronRight')),
  );
  card.append(el('div', { class: 'stepper-scroll' }, line), el('div', { class: 'st-content', id: 'st-content', 'aria-live': 'polite' }), el('div', { class: 'st-sep' }), nav);
  host.replaceChildren(card);
}

function applyStepper(detail, rebuilt) {
  const host = $('#project-progress');
  const stages = detail.stages;
  const n = stages.length;
  if (stepper.view === null || !stages.some((s) => s.id === stepper.view)) stepper.view = stages[currentStageIndex(stages)].id;
  const viewIdx = stages.findIndex((s) => s.id === stepper.view);
  const motion = !reduceMotion.matches;

  // линия и бегущая точка: доля готовности проекта от первого до последнего этапа
  const progress = detail.progress !== null && detail.progress !== undefined ? detail.progress : 0;
  const line = host.querySelector('.stepper');
  const p = Math.max(0, Math.min(1, progress / 100));
  if (rebuilt && motion) requestAnimationFrame(() => requestAnimationFrame(() => line.style.setProperty('--p', p)));
  else line.style.setProperty('--p', p);

  stages.forEach((s, i) => {
    const step = host.querySelector(`.st-step[data-id="${s.id}"]`);
    step.classList.remove('done', 'active', 'todo');
    step.classList.add(s.status);
    step.classList.toggle('viewing', s.id === stepper.view);
    const node = step.querySelector('.st-node');
    if (s.id === stepper.view) node.setAttribute('aria-current', 'step'); else node.removeAttribute('aria-current');
    node.title = `${s.title} — ${STAGE_WORD[s.status]}`;
    const inner = step.querySelector('.st-inner');
    const want = s.status === 'done' ? 'check' : stageIconName(s, i);
    if (inner.dataset.icon !== want) {
      inner.innerHTML = svgMarkup(want);
      inner.dataset.icon = want;
      inner.classList.remove('pop', 'appear');
      void inner.offsetWidth; // перезапуск CSS-анимации
      inner.style.setProperty('--d', rebuilt ? `${120 + i * 70}ms` : '0ms');
      if (motion) inner.classList.add(want === 'check' ? 'pop' : 'appear');
    }
    // пульсирующее кольцо вокруг текущего этапа
    const ring = node.querySelector('.st-ring');
    if (s.status === 'active' && !ring) node.prepend(el('span', { class: 'st-ring' }));
    if (s.status !== 'active' && ring) ring.remove();
  });

  host.querySelector('#st-prev').disabled = viewIdx === 0;
  host.querySelector('#st-next').disabled = viewIdx === n - 1;
  host.querySelector('#st-count').textContent = `Этап ${viewIdx + 1} из ${n}`;

  // содержимое выбранного этапа: уезжает вверх, новое въезжает снизу (AnimatePresence mode="wait")
  const s = stages[viewIdx];
  const key = [s.id, s.status, s.title, s.description, (s.tasks || []).map((t) => t.id).join(','), s.completed_at].join('|');
  if (key === stepper.contentKey) return;
  const sameStage = stepper.contentKey.split('|')[0] === String(s.id);
  stepper.contentKey = key;
  const box = host.querySelector('#st-content');
  const fresh = stageContent(s, viewIdx, n);
  const token = ++stepper.anim;
  const enter = () => {
    if (token !== stepper.anim) return;
    box.replaceChildren(fresh);
    if (motion && !sameStage) fresh.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'cubic-bezier(.2, .8, .2, 1)' });
  };
  const old = box.firstChild;
  if (old && motion && !sameStage) {
    old.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-8px)' }], { duration: 130, easing: 'ease-in', fill: 'forwards' })
      .finished.then(enter, enter);
  } else enter();
}

// Процент в шапке плавно «досчитывает» до нового значения
function updatePercent(detail) {
  const elp = $('#pc-percent');
  if (!elp) return;
  const target = detail && detail.progress !== null && detail.progress !== undefined ? detail.progress : null;
  if (target === null) { elp.textContent = ''; stepper.shownPercent = null; return; }
  const from = stepper.shownPercent === null ? 0 : stepper.shownPercent;
  stepper.shownPercent = target;
  if (reduceMotion.matches || from === target) { elp.textContent = target + '%'; return; }
  const start = performance.now();
  const dur = 700;
  const tick = (now) => {
    const k = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - k, 3);
    elp.textContent = Math.round(from + (target - from) * eased) + '%';
    if (k < 1 && stepper.shownPercent === target) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function renderStepper() {
  const host = $('#project-progress');
  if (!state.project) {
    host.hidden = true;
    host.replaceChildren();
    stepper.key = '';
    return;
  }
  host.hidden = false;
  if (state.detailLoading) {
    if (stepper.key !== `loading|${state.project}`) {
      host.replaceChildren(el('section', { class: 'progress-card glass', 'aria-busy': 'true' },
        el('div', { class: 'pc-head', style: { marginBottom: '0' } }, el('span', { class: 'pc-title' }, 'Готовность проекта'), el('span', { class: 'muted' }, 'загрузка…'))));
      stepper.key = `loading|${state.project}`;
    }
    return;
  }
  const detail = state.detail;
  const stages = (detail && detail.stages) || [];
  const key = `${state.project}|${stages.map((s) => `${s.id}:${s.title}:${s.icon || ''}`).join(',')}|${detail && detail.plan_skipped ? 'skip' : ''}|${detail ? 1 : 0}`;
  const rebuilt = key !== stepper.key;
  if (rebuilt) { buildStepper(host, detail); stepper.key = key; }
  if (stages.length) applyStepper(detail, rebuilt);
  updatePercent(detail);
}

function setStepperView(id) {
  stepper.view = id;
  if (state.detail && state.detail.stages.length) applyStepper(state.detail, false);
}
function stepView(delta) {
  const stages = (state.detail && state.detail.stages) || [];
  const i = stages.findIndex((s) => s.id === stepper.view);
  const next = stages[Math.max(0, Math.min(stages.length - 1, i + delta))];
  if (next) setStepperView(next.id);
}

// ============ лента задач ============
function splitPath(p) {
  const i = Math.max(p.lastIndexOf('/'), p.lastIndexOf('\\'));
  return i < 0 ? ['', p] : [p.slice(0, i + 1), p.slice(i + 1)];
}

function openStageByTitle(project, title) {
  const go = () => {
    const st = state.detail && state.detail.stages.find((s) => s.title === title);
    if (st) setStepperView(st.id);
    $('#feed').scrollTo({ top: 0, behavior: 'smooth' });
    $('#project-progress').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };
  if (state.project !== project) {
    selectProject(project);
    const wait = setInterval(() => { if (state.detail && state.detail.name === project) { clearInterval(wait); go(); } }, 50);
    setTimeout(() => clearInterval(wait), 3000);
  } else go();
}

function revealTask(id) {
  const card = document.querySelector(`.task[data-id="${id}"]`);
  if (!card) return toast('Эта задача ниже в ленте — нажмите «Показать ещё»');
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.classList.add('flash');
  setTimeout(() => card.classList.remove('flash'), 1600);
}
